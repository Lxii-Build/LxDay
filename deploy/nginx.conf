# 林曦日记 · Nginx（后台静态 + API/WS 反代 + uploads 静态）
server {
    listen 80;
    server_name _;
    client_max_body_size 20m;

    # 后台管理前端（Vue 打包产物）
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 业务 API（客户端 /api/v1 与后台 /api/admin 同前缀）
    location /api/ {
        proxy_pass http://server:7740;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # 客户端单张照片上限由 photo_max_mb 控制，默认 20MB、后台可调最高 100MB。
    # 必须覆盖全局 20MB，否则管理员把业务上限调大后会先被 Nginx 截断。
    location = /api/v1/media {
        client_max_body_size 101m;
        proxy_pass http://server:7740;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # WebSocket 实时通道
    location = /ws {
        proxy_pass http://server:7740;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # 私密相册不在 /uploads 静态目录下，必须回源给 Go 的 JWT 鉴权代理。
    # 若缺少这段，Nginx 会把 /media/<id> 当成 SPA 路由，返回 index.html 或 404。
    location /media/ {
        proxy_pass http://server:7740;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # 头像等历史公开资源（与 server 共享卷）
    location /upload/ {
        alias /var/www/uploads/upload/;
        expires 7d;
        access_log off;
    }

    location /uploads/ {
        alias /var/www/uploads/;
        expires 7d;
        access_log off;
    }
}
