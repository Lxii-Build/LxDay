# 林曦日记 · Docker Compose 一键部署（一体化：Go 自托管后台前端 + API + WS + /uploads）
# server 内嵌 admin dist 并自托管静态资源，去除独立 Nginx。
# 生产务必修改 deploy/config.docker.yaml 的 jwt_secret / app_key，以及下方数据库密码。
# TLS 由外部反向代理终止（部署文档另述）。
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_pass_change_me
      MYSQL_DATABASE: linxi
      MYSQL_USER: linxi
      MYSQL_PASSWORD: linxi_pass
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./server/sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-plinxi_pass", "-ulinxi"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./deploy/config.docker.yaml:/app/config.yaml:ro
      - uploads:/app/uploads
    ports:
      - "7740:8080"

volumes:
  mysql_data:
  redis_data:
  uploads:
