# 林曦日记 · Docker Compose 一键部署（Go 服务 + MySQL + Redis + Nginx[后台静态+反代]）
# 生产务必修改 deploy/config.docker.yaml 的 jwt_secret，以及下方数据库密码。
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_pass_change_me
      MYSQL_DATABASE: linxi
      MYSQL_USER: linxi
      MYSQL_PASSWORD: linxi_pass
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./server/sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-plinxi_pass", "-ulinxi"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./deploy/config.docker.yaml:/app/config.yaml:ro
      - uploads:/app/uploads
    expose:
      - "8080"

  web:
    build: ./admin
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads:/var/www/uploads:ro

volumes:
  mysql_data:
  redis_data:
  uploads:
