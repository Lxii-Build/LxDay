name: 构建服务端镜像

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 额外镜像标签（可选，附加在 latest 与短 SHA 之外）
        required: false
        default: ''
  push:
    branches: [ main ]
    paths:
      - 'server/**'
      - 'admin/**'
      - 'Dockerfile'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: 测试并构建推送镜像
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 先跑 Go 测试，失败即止（默认失败即中断后续步骤）
      - name: 配置 Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: 静态检查（go vet）
        working-directory: server
        run: go vet ./...

      - name: 单元测试（go test）
        working-directory: server
        run: go test ./...

      # 测试通过后再构建并推送镜像
      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 计算镜像标签
        id: meta
        env:
          EXTRA_TAG: ${{ inputs.tag }}
        run: |
          IMAGE="ghcr.io/lxii-build/lxday"
          SHA_SHORT="${GITHUB_SHA::7}"
          {
            echo "tags<<EOF"
            echo "${IMAGE}:latest"
            echo "${IMAGE}:${SHA_SHORT}"
            if [ -n "${EXTRA_TAG}" ]; then
              echo "${IMAGE}:${EXTRA_TAG}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # 使用仓库根 Dockerfile（多阶段 server+admin 合并镜像），构建上下文为仓库根
      # 镜像可见性随仓库（私有），不做公开处理
      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}

      # 仓库私有、国内直接拉取不便：额外导出镜像 tar 作为工作流产物，可下载后 `docker load` 直接导入。
      - name: 导出镜像 tar（离线 docker load 用）
        run: |
          IMAGE="ghcr.io/lxii-build/lxday:${GITHUB_SHA::7}"
          docker pull "$IMAGE"
          docker tag "$IMAGE" lxday:latest
          docker save lxday:latest | gzip > lxday-image.tar.gz
          ls -lh lxday-image.tar.gz

      - name: 上传镜像 tar 产物
        uses: actions/upload-artifact@v4
        with:
          name: lxday-server-image
          path: lxday-image.tar.gz
          if-no-files-found: error
          retention-days: 14

