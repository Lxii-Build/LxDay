name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  go-server:
    name: Go 服务端构建与测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: 生成依赖锁
        run: go mod tidy

      - name: 静态检查
        run: go vet ./...

      - name: 编译
        run: go build -o /dev/null ./...

      - name: 单元测试
        run: go test ./...

  admin-web:
    name: 后台前端构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装依赖并构建
        run: |
          npm install
          npm run build

  android-build:
    name: 安卓 Debug APK 构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'

      - name: 运行 Android 单元测试并构建 APK
        run: |
          gradle wrapper --gradle-version 9.7.0 --no-daemon
          ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease --no-daemon

      - name: 上传 gradle wrapper
        uses: actions/upload-artifact@v4
        with:
          name: gradle-wrapper
          path: android/gradle/**
          if-no-files-found: warn

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: linxi-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
