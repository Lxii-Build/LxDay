name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  go-server:
    name: Go 服务端构建与测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: 生成依赖锁
        run: go mod tidy

      - name: 静态检查
        run: go vet ./...

      - name: 编译
        run: go build -o /dev/null ./...

      - name: 单元测试
        run: go test ./...

  android-build:
    name: 安卓 Debug APK 构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: 校验并构建 Debug APK
        run: |
          # 生成 Gradle wrapper（含可执行脚本与 jar），保证后续 CI/本地一致
          gradle wrapper --gradle-version 8.9 --no-daemon
          ./gradlew :app:assembleDebug --no-daemon

      - name: 上传 gradle wrapper
        uses: actions/upload-artifact@v4
        with:
          name: gradle-wrapper
          path: android/gradle/**
          if-no-files-found: warn

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: linxi-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
