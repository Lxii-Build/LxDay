name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  go-server:
    name: Go 服务端构建与测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # go.mod 存在但无 go.sum，先 tidy 生成依赖锁
      - name: 生成依赖锁
        run: go mod tidy

      - name: 静态检查
        run: go vet ./...

      - name: 编译
        run: go build -o /dev/null ./...

      - name: 单元测试
        run: go test ./...

  android-validate:
    name: 安卓源码结构校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 校验 Android 资源 XML 格式
        run: |
          set -e
          python3 - <<'EOF'
          import glob, sys, xml.etree.ElementTree as ET
          files = glob.glob('android/**/*.xml', recursive=True)
          for f in files:
              try:
                  ET.parse(f)
              except Exception as e:
                  print(f'XML 无效: {f}: {e}')
                  sys.exit(1)
          print(f'校验通过：{len(files)} 个 XML')
          EOF

      - name: 校验关键源码文件存在
        run: |
          set -e
          for f in \
            android/app/src/main/AndroidManifest.xml \
            android/app/src/main/res/layout/notification_expanded.xml \
            android/app/src/main/java/com/linxi/diary/MainActivity.kt \
            android/app/src/main/java/com/linxi/diary/service/StatusForegroundService.kt \
            android/app/src/main/java/com/linxi/diary/sync/StatusSyncManager.kt ; do
            test -f "$f" || { echo "缺少文件: $f"; exit 1; }
          done
          echo "安卓源码结构校验通过"
