name: 发布 Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 发布版本 tag（如 v1.0.0）
        required: true
      build_type:
        description: APK 构建类型
        type: choice
        options:
          - Release
          - Debug
        default: Release
      server_url:
        description: 服务端 API 基础地址（BASE_URL）
        required: false
        default: 'https://love.lxii.cc/api/v1'
      ws_url:
        description: WebSocket 地址（WS_URL，留空由 App 推导）
        required: false
        default: ''
      app_key:
        description: 应用密钥（APP_KEY，可选；留空则用仓库 Secret）
        required: false
        default: ''
      prerelease:
        description: 标记为预发布（默认是——正式版要显式关掉）
        type: boolean
        default: true

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: 构建产物并发布 Release
    runs-on: ubuntu-latest
    env:
      IN_BASE_URL: ${{ inputs.server_url }}
      IN_WS_URL: ${{ inputs.ws_url }}
      IN_APP_KEY: ${{ inputs.app_key || secrets.APP_KEY }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # tag 已存在则中止：避免覆盖已发布版本（Release 附件被替换后无法找回旧包）
      - name: 校验 tag 未被占用
        env:
          RAW_VERSION: ${{ inputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/$RAW_VERSION" >/dev/null; then
            echo "::error::tag $RAW_VERSION 已存在，请换一个版本号（不要覆盖已发布版本）"
            exit 1
          fi

      # 由 tag 同时推导 VERSION_NAME 与 VERSION_CODE。
      # 此前 release.yml 完全没传 VERSION_CODE → build.gradle.kts 回退默认值 1
      # → 每个发行版的 versionCode 都是 1，安卓要求递增，用户根本装不上更新。
      # 规则：v1.2.3 → name=1.2.3, code=1*10000+2*100+3=10203（单调递增且与版本名一一对应）
      - name: 解析版本名与版本号
        id: ver
        env:
          RAW_VERSION: ${{ inputs.version }}
        run: |
          NAME="${RAW_VERSION#v}"
          if ! printf '%s' "$NAME" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::版本号必须形如 v1.2.3（当前：$RAW_VERSION）"
            exit 1
          fi
          MAJOR=${NAME%%.*}
          REST=${NAME#*.}
          MINOR=${REST%%.*}
          PATCH=${REST#*.}
          if [ "$MINOR" -gt 99 ] || [ "$PATCH" -gt 99 ]; then
            echo "::error::minor/patch 不得超过 99（versionCode 编码规则限制）"
            exit 1
          fi
          CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "versionName=$NAME versionCode=$CODE"

      # ---------- 构建 Release APK ----------
      - name: 配置 JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'

      - name: 生成 Gradle Wrapper 9.7.0
        working-directory: android
        run: gradle wrapper --gradle-version 9.7.0 --no-daemon

      # 正式签名密钥库从 Secret 解码。发行版**必须**用固定签名，
      # 否则用户装不上更新（这正是本轮要解决的核心问题），故此处密钥缺失即失败。
      - name: 解码正式签名密钥库
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::发行版必须使用固定正式签名，但未配置 ANDROID_KEYSTORE_BASE64。请先在仓库 Secrets 中配置四个签名 Secret。"
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/lxday-release.p12"
          if ! openssl pkcs12 -in "$RUNNER_TEMP/lxday-release.p12" -nokeys -passin pass:"$KS_PASSWORD" -noout 2>/dev/null; then
            echo "::error::密钥库解码失败或口令不匹配。确认 base64 为一整行无换行、口令正确。"
            exit 1
          fi

      # 发行版必须过测试。此前这条流水线从头到尾不跑任何测试，
      # 而 build-android.yml 与 build-server.yml 都跑 —— 等于日常 CI 拦得住的坏提交，
      # 恰好在产出「用户真正安装的那个包」时放过去了。
      - name: 配置 Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: server/go.sum

      - name: 服务端 gofmt / vet / 测试
        working-directory: server
        run: |
          FMT=$(gofmt -l .)
          if [ -n "$FMT" ]; then
            echo "::error::以下文件未 gofmt：$FMT"
            exit 1
          fi
          go vet ./...
          go test -timeout 600s ./...

      - name: 安卓单元测试与 Release Lint
        working-directory: android
        run: |
          ./gradlew :app:testDebugUnitTest :app:lintRelease --no-daemon \
            -PBASE_URL="$IN_BASE_URL" \
            -PWS_URL="$IN_WS_URL" \
            -PAPP_KEY="$IN_APP_KEY" \
            -PVERSION_NAME="${{ steps.ver.outputs.name }}" \
            -PVERSION_CODE="${{ steps.ver.outputs.code }}"

      - name: 构建 APK（${{ inputs.build_type }}）
        working-directory: android
        env:
          IN_VERSION_NAME: ${{ steps.ver.outputs.name }}
          IN_VERSION_CODE: ${{ steps.ver.outputs.code }}
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assemble${{ inputs.build_type }} --no-daemon \
            -PBASE_URL="$IN_BASE_URL" \
            -PWS_URL="$IN_WS_URL" \
            -PAPP_KEY="$IN_APP_KEY" \
            -PVERSION_NAME="$IN_VERSION_NAME" \
            -PVERSION_CODE="$IN_VERSION_CODE" \
            -PKEYSTORE_FILE="$RUNNER_TEMP/lxday-release.p12" \
            -PKEYSTORE_PASSWORD="$KS_PASSWORD" \
            -PKEY_ALIAS="$KS_ALIAS" \
            -PKEY_PASSWORD="$KS_KEY_PASSWORD"

      # 发行版的签名指纹必须与既定指纹一致，不一致即中止发布——
      # 这是「每次 APK 签名统一」这件事的自动化验收关口。
      - name: 校验签名指纹与既定值一致
        working-directory: android
        run: |
          EXPECTED="59:4A:B3:8F:AA:AE:A3:B6:28:E9:0A:A2:55:95:62:66:A1:0C:40:08:76:14:C2:43:E4:AA:DE:35:32:05:76:4F"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          APK=$(find app/build/outputs/apk -name '*.apk' | head -1)
          GOT=$("$APKSIGNER" verify --print-certs "$APK" \
            | grep -i 'SHA-256 digest' | head -1 \
            | sed 's/.*: *//' | tr 'a-f' 'A-F' | sed 's/\(..\)/\1:/g;s/:$//')
          echo "expected=$EXPECTED"
          echo "got=$GOT"
          {
            echo "## 发行版签名指纹"
            echo '```'
            echo "expected: $EXPECTED"
            echo "got     : $GOT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$GOT" != "$EXPECTED" ]; then
            echo "::error::签名指纹与既定值不一致！可能用错了密钥库，发布已中止。"
            exit 1
          fi

      # ---------- 构建并推送服务端镜像（tag = version）----------
      - name: 配置 ARM 构建模拟器
        uses: docker/setup-qemu-action@v3

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 使用仓库根 Dockerfile（多阶段 server+admin 合并镜像），构建上下文为仓库根
      - name: 构建并推送服务端镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/lxii-build/lxday:${{ inputs.version }}

      # 私有仓库国内拉取不便：导出镜像 tar，随 Release 附件下发，可 `docker load` 直接导入
      - name: 导出镜像 tar（离线 docker load 用）
        run: |
          IMAGE="ghcr.io/lxii-build/lxday:${{ inputs.version }}"
          docker pull "$IMAGE"
          docker save "$IMAGE" | gzip > lxday-server-${{ inputs.version }}.tar.gz
          sha256sum lxday-server-${{ inputs.version }}.tar.gz > lxday-server-${{ inputs.version }}.tar.gz.sha256
          ls -lh lxday-server-${{ inputs.version }}.tar.gz

      # ---------- 创建 GitHub Release ----------
      # 说明：应用介绍与本次更新日志由维护者(AI)在正文中补充；更新历史统一维护于仓库根 CHANGELOG.md。
      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          draft: false
          # 预发布默认开：这个项目的常规做法是先发 prerelease 真机验过再转正式版。
          # 注意 boolean 类型的输入在表达式里是字符串 'true'/'false'，不能直接当布尔用。
          prerelease: ${{ inputs.prerelease }}
          files: |
            android/app/build/outputs/apk/**/*.apk
            android/app/build/outputs/mapping/**/mapping.txt
            lxday-server-${{ inputs.version }}.tar.gz
            lxday-server-${{ inputs.version }}.tar.gz.sha256
          body: |
            ## 林曦日记 ${{ inputs.version }}

            <!-- 应用介绍与本次更新日志由维护者(AI)填写；完整更新历史见 CHANGELOG.md -->

            ### 安装说明
            APK 版本号：`versionName=${{ steps.ver.outputs.name }}` / `versionCode=${{ steps.ver.outputs.code }}`

            签名指纹（正式签名，恒定不变，可用于校验安装包来源）：
            ```
            SHA-256: 59:4A:B3:8F:AA:AE:A3:B6:28:E9:0A:A2:55:95:62:66:A1:0C:40:08:76:14:C2:43:E4:AA:DE:35:32:05:76:4F
            ```
            > 若你此前安装过 **旧版本（随机 debug 签名）**，需先卸载再安装本版本；
            > 此后所有版本签名恒定，可直接覆盖升级。

            ### 服务端镜像
            对应 GHCR 镜像 tag：`ghcr.io/lxii-build/lxday:${{ inputs.version }}`

            ```bash
            # 方式一：从 GHCR 拉取（固定版本 tag，公开读取）
            docker pull ghcr.io/lxii-build/lxday:${{ inputs.version }}
            # 方式二：国内直接导入本 Release 附件里的镜像 tar（免拉取）
            sha256sum -c lxday-server-${{ inputs.version }}.tar.gz.sha256
            gunzip -c lxday-server-${{ inputs.version }}.tar.gz | docker load
            ```

            ### 更新日志
            详见 [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ inputs.version }}/CHANGELOG.md)
