name: Deploy 服务端

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 部署环境
        type: choice
        options:
          - production
        default: production
  push:
    branches: [ main ]
    paths:
      - 'server/**'

jobs:
  deploy:
    name: 构建并部署 Go 服务
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: 构建 Linux 二进制
        working-directory: server
        run: |
          go mod tidy
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o linxi-server .

      - name: 上传二进制到服务器
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          key: ${{ secrets.DEPLOY_KEY }}
          source: "server/linxi-server"
          target: "/opt/linxi/bin"
          strip_components: 1

      - name: 重启 systemd 服务
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -e
            chmod +x /opt/linxi/bin/linxi-server
            sudo systemctl restart linxi-server
            sleep 2
            sudo systemctl status linxi-server --no-pager | head -12
            echo "部署完成"
